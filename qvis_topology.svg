<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <style>
      .device { stroke:#1f2937; stroke-width:1.5; }
      .router { fill:#fee2e2; }
      .l3sw   { fill:#fde68a; }
      .l2sw   { fill:#bbf7d0; }
      .server { fill:#e0e7ff; }
      .ap     { fill:#fbcfe8; }
      .label  { font-size:12px; fill:#111827; }
      .small  { font-size:10px; fill:#374151; }
      .vlan   { font-size:10px; fill:#6b21a8; font-weight:600; }
      .link   { stroke:#374151; stroke-width:2; fill:none; }
      .trunk  { stroke:#7c3aed; stroke-width:2.5; fill:none; stroke-dasharray:6 3; }
      .routed { stroke:#dc2626; stroke-width:2.5; fill:none; }
      .title  { font-size:18px; font-weight:700; fill:#111827; }
      .sub    { font-size:12px; fill:#4b5563; }
      .roomLabel { font-size:11px; fill:#374151; font-style:italic; }
    </style>
  </defs>

  <!-- Title -->
  <text x="600" y="30" class="title" text-anchor="middle">QVIS Technology Solutions — Network Topology</text>
  <text x="600" y="50" class="sub" text-anchor="middle">10–20 user office · multi-VLAN · L3 core · Cisco Packet Tracer build</text>

  <!-- Legend -->
  <rect x="20" y="65" width="280" height="110" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="30" y="82" class="label" font-weight="600">Legend</text>
  <line x1="30" y1="98" x2="70" y2="98" class="link"/>
  <text x="78" y="102" class="small">Access link (untagged)</text>
  <line x1="30" y1="118" x2="70" y2="118" class="trunk"/>
  <text x="78" y="122" class="small">802.1Q trunk (multi-VLAN)</text>
  <line x1="30" y1="138" x2="70" y2="138" class="routed"/>
  <text x="78" y="142" class="small">Routed P2P /30 (Layer 3)</text>
  <text x="30" y="162" class="small">VLAN tags shown in purple, IPs in grey</text>

  <!-- Internet cloud -->
  <ellipse cx="600" cy="100" rx="80" ry="32" fill="url(#cloudGrad)" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="600" y="105" class="label" text-anchor="middle" font-weight="600">Internet</text>
  <text x="600" y="120" class="small" text-anchor="middle">203.0.113.0/30</text>

  <!-- R1 Edge Router -->
  <rect x="540" y="170" width="120" height="60" rx="6" class="device router"/>
  <text x="600" y="195" class="label" text-anchor="middle" font-weight="600">R1 — Edge Router</text>
  <text x="600" y="210" class="small" text-anchor="middle">Cisco 2911 · NAT/PAT · ACL</text>
  <text x="600" y="223" class="small" text-anchor="middle">Gi0/0 .2 · Gi0/1 10.10.0.1/30</text>

  <!-- link Internet -> R1 -->
  <line x1="600" y1="132" x2="600" y2="170" class="link"/>

  <!-- CORE-SW1 -->
  <rect x="500" y="300" width="200" height="80" rx="6" class="device l3sw"/>
  <text x="600" y="324" class="label" text-anchor="middle" font-weight="700">CORE-SW1 — Cisco 3650 L3</text>
  <text x="600" y="340" class="small" text-anchor="middle">Inter-VLAN routing on SVIs</text>
  <text x="600" y="354" class="small" text-anchor="middle">Gi1/0/24 routed: 10.10.0.2/30</text>
  <text x="600" y="368" class="vlan" text-anchor="middle">SVIs: 10/20/30/40/50/60/70/80/90 (.1)</text>

  <!-- routed link R1 -> CORE -->
  <line x1="600" y1="230" x2="600" y2="300" class="routed"/>
  <text x="610" y="270" class="vlan">routed /30</text>

  <!-- SERVERS directly on CORE -->
  <rect x="820" y="300" width="200" height="120" rx="6" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="920" y="320" class="label" text-anchor="middle" font-weight="600">Server Room (R7)</text>
  <text x="920" y="334" class="vlan" text-anchor="middle">VLAN 20 SERVERS · 10.10.20.0/24</text>
  <rect x="835" y="345" width="60" height="30" rx="3" class="device server"/>
  <text x="865" y="364" class="small" text-anchor="middle">DC1 .10</text>
  <rect x="900" y="345" width="60" height="30" rx="3" class="device server"/>
  <text x="930" y="364" class="small" text-anchor="middle">DC2 .11</text>
  <rect x="965" y="345" width="50" height="30" rx="3" class="device server"/>
  <text x="990" y="364" class="small" text-anchor="middle">FS1 .12</text>
  <text x="920" y="395" class="small" text-anchor="middle">AD DS · DNS · DHCP · SMB</text>
  <text x="920" y="410" class="small" text-anchor="middle">Connected as access ports on CORE</text>

  <line x1="700" y1="340" x2="820" y2="340" class="link"/>

  <!-- ACC-SW1 (North) -->
  <rect x="180" y="490" width="220" height="70" rx="6" class="device l2sw"/>
  <text x="290" y="513" class="label" text-anchor="middle" font-weight="700">ACC-SW1 — Cisco 2960 (North wing)</text>
  <text x="290" y="530" class="small" text-anchor="middle">Mgmt: 10.10.10.2</text>
  <text x="290" y="546" class="small" text-anchor="middle">Serves R1, R2, R3, R4, R8, R9, R11</text>

  <!-- ACC-SW2 (South) -->
  <rect x="800" y="490" width="220" height="70" rx="6" class="device l2sw"/>
  <text x="910" y="513" class="label" text-anchor="middle" font-weight="700">ACC-SW2 — Cisco 2960 (South wing)</text>
  <text x="910" y="530" class="small" text-anchor="middle">Mgmt: 10.10.10.3</text>
  <text x="910" y="546" class="small" text-anchor="middle">Serves R5, R6, R10, R12</text>

  <!-- Trunks Core -> Access -->
  <path d="M 540 380 Q 360 430 290 490" class="trunk"/>
  <text x="370" y="430" class="vlan">trunk: 10,20,30,40,50,70,80,90 · native 99</text>

  <path d="M 660 380 Q 840 430 910 490" class="trunk"/>
  <text x="800" y="430" class="vlan">trunk: 10,50,60,70,80,90 · native 99</text>

  <!-- End hosts under ACC-SW1 -->
  <g transform="translate(50,610)">
    <rect x="0" y="0" width="120" height="40" rx="4" fill="#eef2ff" stroke="#6366f1"/>
    <text x="60" y="18" class="small" text-anchor="middle" font-weight="600">EXEC office (R2)</text>
    <text x="60" y="32" class="vlan" text-anchor="middle">VLAN 30 EXEC-FIN</text>
  </g>
  <g transform="translate(50,665)">
    <rect x="0" y="0" width="120" height="40" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="60" y="18" class="small" text-anchor="middle" font-weight="600">Finance/HR (R3)</text>
    <text x="60" y="32" class="vlan" text-anchor="middle">VLAN 30 EXEC-FIN</text>
  </g>
  <g transform="translate(190,610)">
    <rect x="0" y="0" width="120" height="40" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="60" y="18" class="small" text-anchor="middle" font-weight="600">Sales bullpen (R4)</text>
    <text x="60" y="32" class="vlan" text-anchor="middle">VLAN 40 STAFF</text>
  </g>
  <g transform="translate(190,665)">
    <rect x="0" y="0" width="120" height="40" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="60" y="18" class="small" text-anchor="middle" font-weight="600">Reception (R1)</text>
    <text x="60" y="32" class="vlan" text-anchor="middle">VLAN 40 STAFF</text>
  </g>
  <g transform="translate(330,610)">
    <rect x="0" y="0" width="120" height="40" rx="4" fill="#fce7f3" stroke="#db2777"/>
    <text x="60" y="18" class="small" text-anchor="middle" font-weight="600">AP1 Lobby</text>
    <text x="60" y="32" class="vlan" text-anchor="middle">SSID Guest → 90</text>
  </g>
  <g transform="translate(330,665)">
    <rect x="0" y="0" width="120" height="40" rx="4" fill="#fce7f3" stroke="#db2777"/>
    <text x="60" y="18" class="small" text-anchor="middle" font-weight="600">AP2 Bullpen</text>
    <text x="60" y="32" class="vlan" text-anchor="middle">SSID Corp+Guest</text>
  </g>
  <g transform="translate(330,720)">
    <rect x="0" y="0" width="120" height="40" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="60" y="18" class="small" text-anchor="middle" font-weight="600">Conf room (R8)</text>
    <text x="60" y="32" class="vlan" text-anchor="middle">VLAN 70 VOICE+ 40</text>
  </g>

  <line x1="180" y1="555" x2="110" y2="610" class="link"/>
  <line x1="220" y1="555" x2="110" y2="665" class="link"/>
  <line x1="280" y1="560" x2="250" y2="610" class="link"/>
  <line x1="300" y1="560" x2="250" y2="665" class="link"/>
  <line x1="340" y1="560" x2="390" y2="610" class="link"/>
  <line x1="360" y1="560" x2="390" y2="665" class="link"/>
  <line x1="380" y1="560" x2="390" y2="720" class="link"/>

  <!-- End hosts under ACC-SW2 -->
  <g transform="translate(750,610)">
    <rect x="0" y="0" width="120" height="40" rx="4" fill="#cffafe" stroke="#0891b2"/>
    <text x="60" y="18" class="small" text-anchor="middle" font-weight="600">Tech desks (R5)</text>
    <text x="60" y="32" class="vlan" text-anchor="middle">VLAN 50 TECH</text>
  </g>
  <g transform="translate(750,665)">
    <rect x="0" y="0" width="120" height="40" rx="4" fill="#cffafe" stroke="#0891b2"/>
    <text x="60" y="18" class="small" text-anchor="middle" font-weight="600">NOC (R6)</text>
    <text x="60" y="32" class="vlan" text-anchor="middle">VLAN 50 TECH</text>
  </g>
  <g transform="translate(890,610)">
    <rect x="0" y="0" width="120" height="40" rx="4" fill="#fde2e4" stroke="#b91c1c"/>
    <text x="60" y="18" class="small" text-anchor="middle" font-weight="600">Training Lab (R10)</text>
    <text x="60" y="32" class="vlan" text-anchor="middle">VLAN 60 LAB · isolated</text>
  </g>
  <g transform="translate(890,665)">
    <rect x="0" y="0" width="120" height="40" rx="4" fill="#fce7f3" stroke="#db2777"/>
    <text x="60" y="18" class="small" text-anchor="middle" font-weight="600">AP3 Lab</text>
    <text x="60" y="32" class="vlan" text-anchor="middle">SSID Lab → 60</text>
  </g>
  <g transform="translate(1030,610)">
    <rect x="0" y="0" width="120" height="40" rx="4" fill="#fef9c3" stroke="#a16207"/>
    <text x="60" y="18" class="small" text-anchor="middle" font-weight="600">Printers</text>
    <text x="60" y="32" class="vlan" text-anchor="middle">VLAN 80 PRINT</text>
  </g>
  <g transform="translate(1030,665)">
    <rect x="0" y="0" width="120" height="40" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="60" y="18" class="small" text-anchor="middle" font-weight="600">VoIP phones</text>
    <text x="60" y="32" class="vlan" text-anchor="middle">VLAN 70 VOICE (aux)</text>
  </g>

  <line x1="830" y1="560" x2="810" y2="610" class="link"/>
  <line x1="850" y1="560" x2="810" y2="665" class="link"/>
  <line x1="900" y1="560" x2="950" y2="610" class="link"/>
  <line x1="920" y1="560" x2="950" y2="665" class="link"/>
  <line x1="990" y1="560" x2="1090" y2="610" class="link"/>
  <line x1="1010" y1="560" x2="1090" y2="665" class="link"/>

  <!-- Footer -->
  <text x="600" y="800" class="sub" text-anchor="middle">Configs in /configs · AD/OU/DHCP/DNS scripts in same folder · Build steps in 04_packet_tracer_build_guide.md</text>
</svg>
